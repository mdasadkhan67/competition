<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for footprint -->
    <radialGradient id="footprintGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#8effa2" />
      <stop offset="50%" stop-color="#1db75b" />
      <stop offset="100%" stop-color="#0a4c24" />
    </radialGradient>
    
    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052520" />
      <stop offset="50%" stop-color="#0b3831" />
      <stop offset="100%" stop-color="#021412" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Paths for Text Alignment -->
    <!-- Top Semi-Circle (clockwise) -->
    <path id="textPathTop" d="M 80,250 A 170,170 0 0,1 420,250" fill="none" />
    <!-- Bottom Semi-Circle (clockwise, from bottom-left to bottom-right) -->
    <!-- To make the text read upright from left to right at the bottom, we need it to go from left to right -->
    <path id="textPathBottom" d="M 80,250 A 170,170 0 0,0 420,250" fill="none" />
  </defs>

  <!-- Outer Dark Ring -->
  <circle cx="250" cy="250" r="235" fill="url(#ringGrad)" stroke="url(#goldGrad)" stroke-width="6" />
  
  <!-- Outer Ring Thin Border -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6" />

  <!-- Inner Circle (Green base) -->
  <circle cx="250" cy="250" r="175" fill="url(#footprintGrad)" stroke="#ffffff" stroke-width="4" />
  <circle cx="250" cy="250" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.8" />

  <!-- The Nalain Shareef (Footprint Shape) Silhouette -->
  <!-- A stylized sandal silhouette, narrow waist, pointed peaks at top and bottom -->
  <path d="M 250,90 
           C 275,100 290,135 295,160 
           C 300,185 290,215 272,235 
           C 255,250 255,260 270,270 
           C 290,285 305,320 300,355 
           C 295,390 270,410 250,420 
           C 230,410 205,390 200,355 
           C 195,320 210,285 230,270 
           C 245,260 245,250 228,235 
           C 210,215 200,185 205,160 
           C 210,135 225,100 250,90 Z" 
        fill="#042a23" 
        stroke="url(#goldGrad)" 
        stroke-width="3" 
        opacity="0.95" />

  <!-- Islamic Geometric Pattern Inside Footprint (Masked or drawn overlay) -->
  <!-- Centered Star Polygon Pattern -->
  <g opacity="0.25" stroke="#ffffff" stroke-width="1" fill="none">
    <!-- Star lines radiating -->
    <path d="M 250,90 L 250,420 M 200,250 L 300,250 M 205,160 L 295,355 M 295,160 L 205,355" />
    <circle cx="250" cy="250" r="40" />
    <circle cx="250" cy="250" r="80" />
    <circle cx="250" cy="250" r="120" />
    <!-- Intricate Star polygons -->
    <polygon points="250,200 285,215 300,250 285,285 250,300 215,285 200,250 215,215" />
    <polygon points="250,170 297,190 320,250 297,310 250,330 203,310 180,250 203,190" />
  </g>

  <!-- Central Circular Calligraphy Badge -->
  <circle cx="250" cy="250" r="48" fill="#ffffff" stroke="url(#ringGrad)" stroke-width="3" />
  <circle cx="250" cy="250" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="1" />
  
  <!-- Arabic Calligraphy Text/Symbol Placeholder -->
  <!-- Standard Calligraphy representation "صلّى الله عليه وسلّم" (using elegant path structures or beautiful glyph styling) -->
  <g fill="#042a23" transform="translate(250, 255) scale(0.9)">
    <!-- Main text base -->
    <text text-anchor="middle" font-family="'Scheherazade New', 'Amiri', 'Georgia', serif" font-size="28" font-weight="bold" letter-spacing="1">محمد</text>
    <text text-anchor="middle" font-family="'Scheherazade New', 'Amiri', 'Georgia', serif" font-size="12" y="-20">صلى الله عليه وسلم</text>
  </g>

  <!-- Outer Ring Text (Circular Text) -->
  <g fill="#ffffff" font-family="'Outfit', 'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="27" letter-spacing="4">
    <!-- Top Text: HERA ISLAMIC CHANNEL -->
    <text fill="#ffffff">
      <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
        HERA ISLAMIC CHANNEL
      </textPath>
    </text>

    <!-- Bottom Text: Quba Zone (Kurla) -->
    <!-- Using a separate path so it is written upright along the bottom arc -->
    <text fill="#ffffff" font-size="25">
      <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
        QUBA ZONE (KURLA)
      </textPath>
    </text>
  </g>

  <!-- Decorative Dots on outer ring (separators) -->
  <circle cx="70" cy="250" r="8" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="430" cy="250" r="8" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2" />
</svg>
